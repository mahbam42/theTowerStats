site_name: theTowerStats

dev_addr: 127.0.0.1:8002
docs_dir: docs

repo_url: https://github.com/mahbam42/theTowerStats
repo_name: theTowerStats

theme:
  name: material
  features:
    - navigation.sections
    - navigation.instant
    - navigation.tracking
    - toc.integrate
    - content.code.annotate
    - content.action.edit

plugins:
  - search
  - gen-files:
      scripts:
        - scripts/mkdocs_gen_repo_docs.py
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: false
            docstring_style: google

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - toc:
      permalink: true

nav:
  - App: https://thetowerstats.up.railway.app/
  - Home: index.md
  - User Guide:
      - Overview: user_guide.md
      - App Philosophy: philosophy.md
      - Search: search.md
      - Demo Data: demo_data.md
      - Battle History:
          - Overview: battle_history.md
          - Battle Report Modal: battle_report_modal.md
      - Charts:
          - Overview: charts.md
          - Chart Builder: charts/chart_builder.md
          - More Options: charts/more_options.md
          - Advanced Analysis: charts/advanced_analysis.md
          - Compare: charts/compare.md
      - Explore: explore.md
      - Goals: goals.md
      - Cards: cards.md
      - Ultimate Weapons: ultimate_weapons.md
      - Guardian Chips: guardian_chips.md
      - Bots: bots.md
  - Project:
      - Changelog: repo/CHANGELOG.md
      - Readme: repo/readme.md
      - Contributing: repo/CONTRIBUTING.md
      - App Philosophy: philosophy.md
      - Design Philosophy: design_philosophy.md
      - Code of Conduct: repo/CODE_OF_CONDUCT.md
      - Versioning: repo/VERSIONING.md
      - Security: repo/SECURITY.md
      
  - Wiki Population: wiki_population.md
  - Development:
      - Project Structure: project_structure.md
      - Design Philosophy: design_philosophy.md
      - Admin Panel: admin_panel.md
      - Explore DSL: explore_dsl.md
      - Progress: 
          - Phase 1: phase1.md
          - Phase 2: phase2.md
          - Phase 2.75: phase275.md
          - Phase 3: phase3.md
          - Phase 4: phase4.md
          - Phase 5 Summary: phase5.md
          - Phase 6 Concepts: phase6_concepts.md
          - Phase 7 Summary: phase7.md
          - Phase 8 Summary: phase8.md
          - Phase 9 Summary: phase9.md
          - Phase 10 Summary: phase10.md
      - Deployment (Railway): deployment.md
      - Clone and Start Locally: clone_start_locally.md
      - Testing:
          - Testing: testing.md
          - Manual Testing Guide: manual_testing.md
      - Goals Dashboard: dev_goals.md
      - Development Notes: development.md
  - Reference:
      - Management Commands: management_commands.md
      - Analytics: reference/analytics.md
      - Core Charting: reference/core_charting.md
      - Core Parsers: reference/core_parsers.md
      - Parameter Keys: parameter_keys.md
      - Public APIs: api.md
